# VelocitySeamless -- backend companion to Velocity-CTD+'s seamless switching.
#
# Needs the packetevents plugin installed alongside it.

# Give an arriving player the entity ID their client already holds, so the proxy can withhold the
# join game and respawn packets and the client keeps the world it already has.
#
# Requires "keep-client-world-on-switch" to be on in the proxy's velocity.toml. The proxy is asked
# for the ID during login, on the channel velocityctd:seamless. If the proxy does not answer, or is
# not a Velocity-CTD+, nothing happens and players join normally.
#
# Needs Paper 1.20.5 or newer (including Folia and Canvas): the entity ID is set through the
# server's own internals, which only became reachable by name once Paper moved to Mojang mappings.
reuse-entity-id-on-switch: true

# Remove the "Loading terrain" screen on a teleport that does not really change the player's world.
#
# Two packets put that screen up. The respawn packet draws it -- Folia moves a player across a
# region boundary by respawning them, so on Folia a long teleport IS a respawn. The "start waiting
# for level chunks" game event then keeps it up. Both are withheld together, and the plugin answers
# the server's wait on the client's behalf, so the client keeps the level it already has and no
# screen appears at all.
#
# A respawn is only withheld when it would not have changed anything the client holds: the same
# world, and the server asking for all player data to be kept. A different world, or a respawn that
# resets the player such as after death, is passed through untouched and keeps its screen -- there
# the client genuinely has to rebuild, and the screen ends as soon as the chunks arrive.
#
# Because the server believes the player finished loading as soon as they are moved, chunks around
# the destination stream in without holding the player still. That is the point, and the cost: on a
# slow connection you may walk briefly over terrain that has not arrived yet.
hide-teleport-loading-screen: true

# Log what the plugin decides for every loading request and every arriving player. Turn this on when
# a loading screen still appears and it is not obvious why: it reports whether the proxy had an
# entity ID to reuse, and whether each request was suppressed or deliberately allowed through.
debug: true
